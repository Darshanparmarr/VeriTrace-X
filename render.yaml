# Render blueprint for the VeriTrace-X backend + managed Postgres (free tier).
# Deploy: push this repo to GitHub, then "New > Blueprint" in Render and point it here.
# Confirm current free-tier limits before relying on them (free DBs/web services expire/sleep).
services:
  - type: web
    name: veritrace-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: BLOCKCHAIN_MODE
        value: development
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: veritrace-db
          property: connectionString
      # Set to your deployed frontend origin (e.g. https://veritrace-x.vercel.app)
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: veritrace-db
    plan: free
    databaseName: veritrace
    user: veritrace
